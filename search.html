<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Products — BuyHere</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="BuyHere Logo" class="brand-logo-img">
      </a>

      <form class="search-form" id="search-form" action="search.html" method="GET">
        <input type="search" id="search-input" name="q" placeholder="Search products..." autocomplete="off">
        <button type="submit">Search</button>
      </form>

      <a href="index.html" class="header-home-link">Home</a>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">
    <div style="margin-bottom: 28px;">
      <h1 id="search-title" style="color: var(--primary);">Search Products</h1>
      <p id="search-description" style="color: var(--text-muted);">Find the products you're looking for.</p>
    </div>

    <!-- RESULTS -->
    <div id="search-results" class="products-grid">
      <div class="search-loading">Loading products...</div>
    </div>

    <!-- NO RESULTS -->
    <div id="no-results" style="text-align: center; padding: 60px 0;" hidden>
      <h2>No products found</h2>
      <p style="color: var(--text-muted); margin: 12px 0 24px;">Try searching with different keywords.</p>
      <a href="index.html" class="checkout-button" style="display: inline-block; width: auto; padding: 12px 24px;">Back to Home</a>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a href="index.html" class="brand">
          <img src="images/logo.png" alt="BuyHere Logo" class="brand-logo-img">
        </a>
        <p>Promote. Discover. Shop.</p>
      </div>
      <p class="footer-copyright">© 2026 BuyHere. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/search.js"></script>
</body>

</html>

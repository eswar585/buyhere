<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Search Products — BuyHere</title>

  <meta
    name="description"
    content="Search and discover products."
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>


<body>

  <!-- HEADER -->

  <header class="site-header">

    <div class="container header-inner">

      <a
        href="index.html"
        class="site-logo"
      >
        BuyHere
      </a>


      <form
        class="search-form"
        id="search-form"
        action="search.html"
        method="GET"
      >

        <input
          type="search"
          id="search-input"
          name="q"
          placeholder="Search products..."
          autocomplete="off"
        >

        <button
          type="submit"
          aria-label="Search"
        >
          Search
        </button>

      </form>


      <a
        href="index.html"
        class="header-home-link"
      >
        Home
      </a>

    </div>

  </header>


  <!-- MAIN -->

  <main>

    <section class="search-page">

      <div class="container">

        <div class="search-page-header">

          <div class="search-eyebrow">
            SEARCH
          </div>

          <h1 id="search-title">
            Search products
          </h1>

          <p id="search-description">
            Find the products you're looking for.
          </p>

        </div>


        <!-- RESULTS -->

        <div
          id="search-results"
          class="product-grid"
        >

          <div class="search-loading">
            Loading products...
          </div>

        </div>


        <!-- NO RESULTS -->

        <div
          id="no-results"
          class="search-no-results"
          hidden
        >

          <h2>
            No products found
          </h2>

          <p>
            Try searching for another product.
          </p>

          <a
            href="index.html"
            class="search-back-button"
          >
            Back to home
          </a>

        </div>

      </div>

    </section>

  </main>


  <!-- FOOTER -->

  <footer class="site-footer">

    <div class="container">

      <p>
        © 2026 BuyHere
      </p>

    </div>

  </footer>


  <script src="js/config.js"></script>
  <script src="js/search.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuyHere — Promote. Discover. Shop.</title>
  <meta name="description" content="Discover top products and deals on BuyHere.">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="BuyHere Logo" class="brand-logo-img">
      </a>

      <form class="search-form" id="search-form" action="search.html" method="GET">
        <input type="search" id="search-input" name="q" placeholder="Search products..." autocomplete="off">
        <button type="submit" aria-label="Search">Search</button>
      </form>

      <a href="index.html" class="header-home-link">Home</a>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="container">
      <p class="hero-subtitle">PROMOTE. DISCOVER. SHOP.</p>
      <h1 class="hero-title">Find the Best Products Online</h1>
      <form class="hero-search" action="search.html" method="GET">
        <input type="search" name="q" placeholder="What are you looking for today?">
        <button type="submit">Search</button>
      </form>
    </div>
  </section>

  <!-- MAIN CATALOG -->
  <main class="container">
    <div class="collection-header">
      <div>
        <span>CURATED CATALOG</span>
        <h2>Featured Products</h2>
      </div>
    </div>

    <div id="product-grid" class="products-grid">
      <!-- Dynamically populated by JS -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a href="index.html" class="brand">
          <img src="images/logo.png" alt="BuyHere Logo" class="brand-logo-img">
        </a>
        <p>Promote. Discover. Shop.</p>
      </div>
      <p class="footer-copyright">© 2026 BuyHere. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — BuyHere</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .product-detail-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      background: #fff;
      padding: 32px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }
    .product-detail-image img {
      width: 100%;
      border-radius: var(--radius-sm);
      object-fit: cover;
    }
    .product-detail-info h1 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .product-detail-price {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 20px;
    }
    .product-detail-description {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 28px;
    }
    @media (max-width: 768px) {
      .product-detail-container { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="BuyHere Logo" class="brand-logo-img">
      </a>

      <form class="search-form" action="search.html" method="GET">
        <input type="search" name="q" placeholder="Search products..." autocomplete="off">
        <button type="submit">Search</button>
      </form>

      <a href="index.html" class="header-home-link">Home</a>
    </div>
  </header>

  <!-- MAIN DETAIL -->
  <main class="container">
    <div id="product-container" class="product-detail-container">
      <div class="product-detail-image">
        <img id="product-image" src="https://placehold.co/500x500/f5f5f5/777?text=Loading..." alt="Product Image">
      </div>
      <div class="product-detail-info">
        <h1 id="product-name">Loading...</h1>
        <div id="product-price" class="product-detail-price">₹0</div>
        <p id="product-description" class="product-detail-description">Loading details...</p>
        <a id="product-link" href="#" target="_blank" rel="nofollow sponsored noopener" class="checkout-button">
          Buy Now / View Deal
        </a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a href="index.html" class="brand">
          <img src="images/logo.png" alt="BuyHere Logo" class="brand-logo-img">
        </a>
        <p>Promote. Discover. Shop.</p>
      </div>
      <p class="footer-copyright">© 2026 BuyHere. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/product.js"></script>
</body>

</html>
